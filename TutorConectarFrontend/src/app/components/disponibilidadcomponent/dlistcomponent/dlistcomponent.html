<h2>Disponibilidad horaria</h2>

<div class="filtros">
  <input type="number" placeholder="ID del tutor" [(ngModel)]="idTutor">
  <button (click)="filtrarTutor()">Filtrar por tutor</button>
  <input type="text" placeholder="Día (ej. Lunes)" [(ngModel)]="dia">
  <button (click)="filtrarDia()">Filtrar por día</button>
  <button (click)="listar()">Ver todas</button>
</div>

<p class="mensaje">{{ mensaje }}</p>

<div class="tabla">
  <table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="A">
      <th mat-header-cell *matHeaderCellDef> Id </th>
      <td mat-cell *matCellDef="let e"> {{e.idDisponibilidad}} </td>
    </ng-container>
    <ng-container matColumnDef="B">
      <th mat-header-cell *matHeaderCellDef> Tutor </th>
      <td mat-cell *matCellDef="let e"> {{e.nombreTutor}} </td>
    </ng-container>
    <ng-container matColumnDef="C">
      <th mat-header-cell *matHeaderCellDef> Día </th>
      <td mat-cell *matCellDef="let e"> {{e.diaSemana}} </td>
    </ng-container>
    <ng-container matColumnDef="D">
      <th mat-header-cell *matHeaderCellDef> Desde </th>
      <td mat-cell *matCellDef="let e"> {{e.horaInicio}} </td>
    </ng-container>
    <ng-container matColumnDef="E">
      <th mat-header-cell *matHeaderCellDef> Hasta </th>
      <td mat-cell *matCellDef="let e"> {{e.horaFin}} </td>
    </ng-container>
    <ng-container matColumnDef="F">
      <th mat-header-cell *matHeaderCellDef> Disponible </th>
      <td mat-cell *matCellDef="let e"> {{e.disponible ? 'Sí' : 'No'}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
