<div class="page-head">
  <div><h2>{{ id ? 'Editar rol' : 'Registrar rol' }}</h2></div>
  <a class="btn sec" routerLink="/admin/roles"><span class="material-icons">arrow_back</span>Volver</a>
</div>
<div class="card">
  <form class="form" (ngSubmit)="aceptar()">
    <label class="campo">Denominación *<input name="den" [(ngModel)]="r.denominacion" placeholder="ADMIN, TUTOR, ESTUDIANTE..." required></label>
    <label class="campo">Descripción<textarea name="desc" [(ngModel)]="r.descripcion"></textarea></label>
    @if (error) { <div class="aviso error">{{ error }}</div> }
    <div class="acciones"><button class="btn" type="submit">Guardar</button><a class="btn sec" routerLink="/admin/roles">Cancelar</a></div>
  </form>
</div>
